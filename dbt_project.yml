name: 'gea_telemetry'
version: '1.0.0'
config-version: 2

profile: 'gea_telemetry'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
docs-paths: ["docs"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # First-run fallback watermark for models driven by silver_tec_watermark.
  watermark_default_start: '1900-01-01T00:00:00'
  # Simulated daily gateway load. When set (e.g. --vars 'load_date: 2026-04-02')
  # the bronze fact model appends only that batch; unset loads every batch.
  load_date: ''

seeds:
  gea_telemetry:
    +schema: raw
    +quote_columns: false
    +persist_docs:
      relation: true
      columns: true
    raw_device_events:
      +column_types:
        event_timestamp: timestamp
        source_ingested_at: timestamp
        event_date: date
        load_date: date

models:
  gea_telemetry:
    +materialized: view
    +persist_docs:
      relation: true
      columns: true
    bronze:
      +materialized: incremental
      +schema: bronze
      +tags: ['bronze']
      +on_schema_change: fail
    silver:
      +schema: silver
      +tags: ['silver']
    gold:
      +materialized: view
      +schema: gold
      +tags: ['gold']
