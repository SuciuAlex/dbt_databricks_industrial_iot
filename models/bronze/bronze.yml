version: 2

models:
  - name: bronze_machines
    description: "{{ doc('table_bronze_machines') }}"
    columns:
      - name: machine_id
        description: "{{ doc('column_machine_id') }}"
        tests:
          - unique
          - not_null
      - name: machine_type
        tests:
          - accepted_values:
              values: ['SLICER', 'COOKER', 'BAKER', 'PACKER']

  - name: bronze_event_types
    description: "{{ doc('table_bronze_event_types') }}"
    columns:
      - name: event_type_code
        description: "{{ doc('column_event_type_code') }}"
        tests:
          - unique
          - not_null

  - name: bronze_error_codes
    description: "{{ doc('table_bronze_error_codes') }}"
    columns:
      - name: error_code
        description: "{{ doc('column_error_code') }}"
        tests:
          - unique
          - not_null
      - name: severity
        tests:
          - accepted_values:
              values: ['LOW', 'MEDIUM', 'HIGH', 'CRITICAL']

  - name: bronze_device_events
    description: "{{ doc('table_bronze_device_events') }}"
    columns:
      - name: event_id
        description: "{{ doc('column_event_id') }}"
        tests:
          - unique
          - not_null
      - name: machine_id
        description: "{{ doc('column_machine_id') }}"
        tests:
          - not_null
          - relationships:
              to: ref('bronze_machines')
              field: machine_id
      - name: event_type_code
        description: "{{ doc('column_event_type_code') }}"
        tests:
          - relationships:
              to: ref('bronze_event_types')
              field: event_type_code
      - name: event_timestamp
        description: "{{ doc('column_event_timestamp') }}"
        tests:
          - not_null
