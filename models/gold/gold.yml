      - name: last_event_timestamp
        description: "{{ doc('column_last_event_timestamp') }}"
      - name: timestamp_of_min_value
        description: "{{ doc('column_timestamp_of_min_value') }}"
      - name: timestamp_of_max_value
        description: "{{ doc('column_timestamp_of_max_value') }}"
      - name: avg_seconds_between_events
        description: "{{ doc('column_avg_seconds_between_events') }}"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - machine_id
            - event_type_code
            - bucket_start

  - name: agg_event_frequency_day
    description: "{{ doc('table_agg_event_frequency_day') }}"
    columns:
      - name: machine_id
        description: "{{ doc('column_machine_id') }}"
        tests:
          - not_null
      - name: event_type_code
        description: "{{ doc('column_event_type_code') }}"
        tests:
          - not_null
      - name: bucket_start
        description: "{{ doc('column_bucket_start') }}"
        tests:
          - not_null
      - name: event_count
        description: "{{ doc('column_event_count') }}"
