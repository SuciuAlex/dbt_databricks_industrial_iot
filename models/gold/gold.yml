      - name: event_type_code
        description: "{{ doc('column_event_type_code') }}"
        tests:
          - not_null
      - name: bucket_start
        description: "{{ doc('column_bucket_start') }}"
        tests:
          - not_null
      - name: event_count
        description: "{{ doc('column_event_count') }}"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
