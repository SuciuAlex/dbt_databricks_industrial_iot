version: 2

models:
  - name: dim_machine_status
    description: "{{ doc('table_dim_machine_status') }}"
    columns:
      - name: machine_id
        tests:
          - unique
          - not_null

  - name: dim_machine_status_history
    description: "{{ doc('table_dim_machine_status_history') }}"
    columns:
      - name: machine_sk
        tests:
          - unique
          - not_null
      - name: machine_id
        tests:
          - not_null

  - name: agg_machine_uptime_daily
    description: "{{ doc('table_agg_machine_uptime_daily') }}"
    columns:
      - name: machine_id
        tests:
          - not_null
      - name: event_date
        tests:
          - not_null
      - name: pct_running
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100
              row_condition: "pct_running is not null"
      - name: pct_down
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100
              row_condition: "pct_down is not null"
      - name: pct_idle
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100
              row_condition: "pct_idle is not null"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - machine_id
            - event_date

  - name: agg_machine_type_performance
    description: "{{ doc('table_agg_machine_type_performance') }}"
    columns:
      - name: machine_type
        tests:
          - not_null
      - name: event_date
        tests:
          - not_null

  - name: agg_error_analysis
    description: "{{ doc('table_agg_error_analysis') }}"
    columns:
      - name: machine_type
        tests:
          - not_null
      - name: severity
        tests:
          - accepted_values:
              values: ['LOW', 'MEDIUM', 'HIGH', 'CRITICAL']

  - name: agg_production_output
    description: "{{ doc('table_agg_production_output') }}"
    columns:
      - name: machine_id
        tests:
          - not_null
      - name: event_date
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - machine_id
            - event_date

  - name: agg_event_frequency_minute
    description: "{{ doc('table_agg_event_frequency_minute') }}"
    columns:
      - name: machine_id
        tests:
          - not_null
      - name: event_type_code
        tests:
          - not_null
      - name: bucket_start
        tests:
          - not_null
      - name: event_count
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - machine_id
            - event_type_code
            - bucket_start

  - name: agg_event_frequency_hour
    description: "{{ doc('table_agg_event_frequency_hour') }}"
    columns:
      - name: machine_id
        tests:
          - not_null
      - name: event_type_code
        tests:
          - not_null
      - name: bucket_start
        tests:
          - not_null
      - name: event_count
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - machine_id
            - event_type_code
            - bucket_start

  - name: agg_event_frequency_day
    description: "{{ doc('table_agg_event_frequency_day') }}"
    columns:
      - name: machine_id
        tests:
          - not_null
      - name: event_type_code
        tests:
          - not_null
      - name: bucket_start
        tests:
          - not_null
      - name: event_count
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - machine_id
            - event_type_code
            - bucket_start
