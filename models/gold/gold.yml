version: 2

models:
  - name: dim_machine_status
    description: "Gold dimension view exposing the current machine status for each machine."
    columns:
      - name: machine_id
        tests:
          - unique
          - not_null

  - name: dim_machine_status_history
    description: "Gold dimension view exposing the full machine-status history from the SCD2 silver model."
    columns:
      - name: machine_sk
        tests:
          - unique
          - not_null
      - name: machine_id
        tests:
          - not_null

  - name: agg_machine_uptime_daily
    description: "Gold aggregate view showing daily machine uptime composition by machine."
    columns:
      - name: machine_id
        tests:
          - not_null
      - name: event_date
        tests:
          - not_null
      - name: pct_running
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100
              row_condition: "pct_running is not null"
      - name: pct_down
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100
              row_condition: "pct_down is not null"
      - name: pct_idle
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100
              row_condition: "pct_idle is not null"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - machine_id
            - event_date

  - name: agg_machine_type_performance
    description: "Gold aggregate view showing average sensor performance by machine type and day."
    columns:
      - name: machine_type
        tests:
          - not_null
      - name: event_date
        tests:
          - not_null

  - name: agg_error_analysis
    description: "Gold aggregate view summarizing error frequency, severity mix, and mean resolution time."
    columns:
      - name: machine_type
        tests:
          - not_null
      - name: severity
        tests:
          - accepted_values:
              values: ['LOW', 'MEDIUM', 'HIGH', 'CRITICAL']

  - name: agg_production_output
    description: "Gold aggregate view summarizing daily production output and cycle activity."
    columns:
      - name: machine_id
        tests:
          - not_null
      - name: event_date
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - machine_id
            - event_date

  - name: agg_event_frequency_minute
    description: "Gold aggregate view for event frequency at minute grain."
    columns:
      - name: machine_id
        tests:
          - not_null
      - name: event_type_code
        tests:
          - not_null
      - name: bucket_start
        tests:
          - not_null
      - name: event_count
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - machine_id
            - event_type_code
            - bucket_start

  - name: agg_event_frequency_hour
    description: "Gold aggregate view for event frequency at hour grain."
    columns:
      - name: machine_id
        tests:
          - not_null
      - name: event_type_code
        tests:
          - not_null
      - name: bucket_start
        tests:
          - not_null
      - name: event_count
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - machine_id
            - event_type_code
            - bucket_start

  - name: agg_event_frequency_day
    description: "Gold aggregate view for event frequency at day grain."
    columns:
      - name: machine_id
        tests:
          - not_null
      - name: event_type_code
        tests:
          - not_null
      - name: bucket_start
        tests:
          - not_null
      - name: event_count
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - machine_id
            - event_type_code
            - bucket_start
