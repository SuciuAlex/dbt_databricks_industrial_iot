version: 2

models:
  - name: silver_dim_machines
    description: "Silver SCD2 history table for machine status changes and current-state tracking."
    columns:
      - name: machine_sk
        description: "Surrogate key for the machine status row."
        tests:
          - unique
          - not_null
      - name: machine_id
        tests:
          - relationships:
              to: ref('bronze_machines')
              field: machine_id
      - name: valid_from
        description: "Timestamp when the row became valid."
        tests:
          - not_null
      - name: valid_to
        description: "Timestamp when the row stopped being valid."
      - name: is_current
        description: "Flag indicating the row is the current version of the machine status."

  - name: silver_fact_device_events
    description: "Silver fact table exposing conformed device events and a generic event_value payload."
    columns:
      - name: event_id
        tests:
          - unique
          - not_null
      - name: machine_id
        tests:
          - relationships:
              to: ref('silver_dim_machines')
              field: machine_id
      - name: event_value
        description: "Generic numeric payload used for sensor and count-based event analysis."
  - name: silver_fact_error_events
    description: "Silver fact table pairing fault raises and resolves into resolution metrics."
    columns:
      - name: machine_id
        tests:
          - not_null
      - name: error_code
        tests:
          - not_null
          - relationships:
              to: ref('bronze_error_codes')
              field: error_code
      - name: raised_at
        tests:
          - not_null
      - name: resolved_at
        description: "Timestamp when the error was resolved."
      - name: resolution_time_seconds
        description: "Elapsed seconds between raise and resolve timestamps."

  - name: silver_tec_watermark
    description: "Technical watermark table that stores the last processed event timestamp per machine and event type."
    columns:
      - name: last_processed_event_timestamp
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - machine_id
            - event_type_code

  - name: silver_tec_kpi_mapping
    description: "Technical mapping table linking each machine/event combination to a KPI code."
    columns:
      - name: kpi_code
        tests:
          - not_null
          - accepted_values:
              values: ['all']
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - machine_id
            - event_type_code
            - kpi_code

  - name: silver_tec_batch_execution_log
    description: "Technical execution log capturing watermark-driven batch run metrics."
    columns:
      - name: run_started_at
        tests:
          - not_null
      - name: run_completed_at
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - batch_run_id
            - model_name
