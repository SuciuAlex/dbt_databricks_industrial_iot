version: 2

models:
  - name: silver_dim_machines
    description: "{{ doc('column_silver_dim_machines') }}"
    columns:
      - name: machine_sk
        description: "{{ doc('column_machine_sk') }}"
        tests:
          - unique
          - not_null
      - name: machine_id
        tests:
          - relationships:
              to: ref('bronze_machines')
              field: machine_id
      - name: valid_from
        description: "{{ doc('column_valid_from') }}"
        tests:
          - not_null
      - name: valid_to
        description: "{{ doc('column_valid_to') }}"
      - name: is_current
        description: "{{ doc('column_is_current') }}"

  - name: silver_fact_device_events
    description: "{{ doc('column_silver_fact_device_events') }}"
    columns:
      - name: event_id
        tests:
          - unique
          - not_null
      - name: machine_id
        tests:
          - relationships:
              to: ref('silver_dim_machines')
              field: machine_id
      - name: event_value
        description: "{{ doc('column_event_value') }}"
  - name: silver_fact_error_events
    description: "{{ doc('column_silver_fact_error_events') }}"
    columns:
      - name: machine_id
        tests:
          - not_null
      - name: error_code
        tests:
          - not_null
          - relationships:
              to: ref('bronze_error_codes')
              field: error_code
      - name: raised_at
        tests:
          - not_null
      - name: resolved_at
        description: "{{ doc('column_resolved_at') }}"
      - name: resolution_time_seconds
        description: "{{ doc('column_resolution_time_seconds') }}"

  - name: silver_tec_watermark
    description: "{{ doc('column_silver_tec_watermark') }}"
    columns:
      - name: last_processed_event_timestamp
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - machine_id
            - event_type_code

  - name: silver_tec_kpi_mapping
    description: "{{ doc('column_silver_tec_kpi_mapping') }}"
    columns:
      - name: kpi_code
        tests:
          - not_null
          - accepted_values:
              values: ['all']
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - machine_id
            - event_type_code
            - kpi_code

  - name: silver_tec_batch_execution_log
    description: "{{ doc('column_silver_tec_batch_execution_log') }}"
    columns:
      - name: run_started_at
        tests:
          - not_null
      - name: run_completed_at
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - batch_run_id
            - model_name
