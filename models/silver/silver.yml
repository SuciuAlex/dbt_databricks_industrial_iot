version: 2

models:
  - name: silver_dim_machines
    description: >
      SCD Type 2 dimension: one row per machine per status-attribute
      version. Built from `bronze_machines` joined with `STATUS_CHANGE`
      events from `bronze_device_events`; `valid_from`/`valid_to` derived
      with a `lead()` window per `machine_id`. This is the canonical table
      other models join to for "status as of time T" or "current status"
      lookups.
    columns:
      - name: machine_sk
        description: Surrogate key, `generate_surrogate_key(['machine_id', 'valid_from'])`.
        tests:
          - unique
          - not_null
      - name: machine_id
        tests:
          - relationships:
              to: ref('bronze_machines')
              field: machine_id
      - name: valid_from
        description: Timestamp this version of the machine's status became effective.
        tests:
          - not_null
      - name: valid_to
        description: Timestamp this version stopped being effective; null for the current version.
      - name: is_current
        description: True when `valid_to` is null (the currently-active row for this machine).

  - name: silver_fact_device_events
    description: >
      Conformed, business-ready event fact — one row per device event, with
      machine/event-type attributes joined in and a generic `event_value`
      column populated from whichever type-specific payload column applies.
    columns:
      - name: event_id
        tests:
          - unique
          - not_null
      - name: machine_id
        tests:
          - relationships:
              to: ref('silver_dim_machines')
              field: machine_id
      - name: event_value
        description: >
          Type-specific numeric payload normalized into one column (temperature
          for sensor-temperature events, speed for sensor-speed events, etc.);
          null for event types with no natural numeric payload.

  - name: silver_fact_error_events
    description: >
      Derived from `silver_fact_device_events`: pairs `ERROR_RAISED` ->
      `ERROR_RESOLVED` per `machine_id` + `error_code`, computing
      `resolution_time_seconds`, joined to `bronze_error_codes` for severity.
    columns:
      - name: machine_id
        tests:
          - not_null
      - name: error_code
        tests:
          - not_null
          - relationships:
              to: ref('bronze_error_codes')
              field: error_code
      - name: raised_at
        tests:
          - not_null
      - name: resolved_at
        description: Timestamp the paired ERROR_RESOLVED event occurred.
      - name: resolution_time_seconds
        description: Seconds between raised_at and resolved_at.

  - name: silver_tec_watermark
    description: >
      Technical control table (not business-facing): one row per
      machine_id + event_type_code holding last_processed_event_timestamp,
      consumed and advanced by the agg_event_frequency_* gold models.
    columns:
      - name: last_processed_event_timestamp
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - machine_id
            - event_type_code

  - name: silver_tec_kpi_mapping
    description: >
      Technical control table (not business-facing): maps every
      machine_id + event_type_code combination to a kpi_code, defaulting to
      'all' as a placeholder until specific KPIs are defined.
    columns:
      - name: kpi_code
        tests:
          - not_null
          - accepted_values:
              values: ['all']
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - machine_id
            - event_type_code
            - kpi_code

  - name: silver_tec_batch_execution_log
    description: >
      Technical control table (not business-facing): one row per batch run
      of a watermark-driven model, written entirely via the
      log_batch_execution() post-hook macro — this model's own defining
      query always returns zero rows.
    columns:
      - name: run_started_at
        tests:
          - not_null
      - name: run_completed_at
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - batch_run_id
            - model_name
