version: 2

seeds:
  - name: raw_machines
    description: >
      Raw dimension seed: one row per physical GEA machine in the fleet (20
      machines across 4 process areas). This is the raw layer for the
      demo — loaded via `dbt seed` and referenced downstream exclusively
      through `ref('raw_machines')`.
    columns:
      - name: machine_id
        description: Natural key, pattern `<TYPE_PREFIX>-<3-digit sequence>` (e.g. `SLC-001`).
        tests:
          - unique
          - not_null
      - name: machine_type
        description: One of the four GEA process areas.
        tests:
          - accepted_values:
              values: ['SLICER', 'COOKER', 'BAKER', 'PACKER']
      - name: model_name
        description: Commercial model name of the machine.
      - name: manufacturer
        description: Always "GEA Group" for this fleet.
      - name: plant_location
        description: City where the machine is installed.
      - name: plant_country
        description: Country where the machine is installed.
      - name: install_date
        description: Date the machine was commissioned at its plant.
      - name: rated_capacity
        description: Manufacturer-rated throughput capacity, in `capacity_unit`.
      - name: capacity_unit
        description: Unit for `rated_capacity`, varies by `machine_type`.
      - name: initial_firmware_version
        description: Firmware version installed at commissioning time.

  - name: raw_event_types
    description: >
      Raw dimension seed: the shared event-type catalog emitted by every
      machine's IoT gateway, regardless of machine type (payload columns are
      simply NULL where not applicable to a given event).
    columns:
      - name: event_type_code
        description: Natural key for the event type (e.g. `STATUS_CHANGE`, `SENSOR_TEMPERATURE_READING`).
        tests:
          - unique
          - not_null
      - name: event_category
        description: High-level grouping of the event type.
        tests:
          - accepted_values:
              values: ['lifecycle', 'production', 'telemetry', 'fault', 'maintenance']
      - name: description
        description: Human-readable description of what the event represents.
      - name: has_numeric_payload
        description: Whether this event type carries a meaningful numeric payload value.

  - name: raw_error_codes
    description: >
      Raw dimension seed: fault/error reference catalog referenced by
      `ERROR_RAISED` / `ERROR_RESOLVED` device events.
    columns:
      - name: error_code
        description: Natural key for the error code (e.g. `E-101`).
        tests:
          - unique
          - not_null
      - name: severity
        description: Severity classification of the fault.
        tests:
          - accepted_values:
              values: ['LOW', 'MEDIUM', 'HIGH', 'CRITICAL']
      - name: description
        description: Human-readable description of the fault condition.
      - name: requires_maintenance
        description: Whether this fault typically requires a maintenance intervention to clear.

  - name: raw_device_events
    description: >
      Raw fact seed: one row per event emitted by a machine's IoT gateway
      over a 3-month synthetic window (~800k rows). This seed intentionally
      contains a small amount of data-quality noise — a handful of
      duplicate `event_id`s and a few rows with a null `machine_id` — which
      `bronze_device_events` is responsible for cleaning up. No generic
      tests are applied at this layer for that reason; the bronze layer's
      `unique`/`not_null` tests are what demonstrate the cleanup actually
      working.
    columns:
      - name: event_id
        description: UUID assigned to the event by the simulated gateway. Not guaranteed unique in this raw seed (see above).
      - name: machine_id
        description: FK to `raw_machines.machine_id`. A few rows are intentionally null in this raw seed.
      - name: machine_type
        description: Denormalized copy of the emitting machine's type.
      - name: event_type_code
        description: FK to `raw_event_types.event_type_code`.
      - name: event_timestamp
        description: UTC timestamp the event occurred, within the 2026-04-01 to 2026-06-30 window.
      - name: event_date
        description: Date part of `event_timestamp`, provided for partition-friendly filtering.
      - name: status_value
        description: Populated only for `STATUS_CHANGE` events.
      - name: temperature_c
        description: Populated only for `SENSOR_TEMPERATURE_READING` events.
      - name: speed_units_per_min
        description: Populated only for `SENSOR_SPEED_READING` events.
      - name: vibration_mm_s
        description: Populated only for `SENSOR_VIBRATION_READING` events.
      - name: product_count
        description: Populated for `PRODUCT_COUNT_UPDATE` and `CYCLE_COMPLETE` events.
      - name: cycle_duration_seconds
        description: Populated only for `CYCLE_COMPLETE` events.
      - name: error_code
        description: FK to `raw_error_codes.error_code`, populated only for `ERROR_RAISED` / `ERROR_RESOLVED` events.
      - name: source_ingested_at
        description: Simulated ingestion timestamp (`event_timestamp` plus a small random lag).
