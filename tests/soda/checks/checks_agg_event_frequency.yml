checks for agg_event_frequency_minute:
  - failed rows:
      name: event_count is always >= 1
      fail query: |
        select machine_id, event_type_code, bucket_start
        from agg_event_frequency_minute
        where event_count < 1

  - failed rows:
      name: avg_seconds_between_events null only when event_count = 1
      fail query: |
        select machine_id, event_type_code, bucket_start
        from agg_event_frequency_minute
        where avg_seconds_between_events is null
          and event_count > 1

  - failed rows:
      name: bucket_start falls within the synthetic dataset's 3-month window
      fail query: |
        select machine_id, event_type_code, bucket_start
        from agg_event_frequency_minute
        where bucket_start < timestamp('2026-04-01')
           or bucket_start > timestamp('2026-07-01')

